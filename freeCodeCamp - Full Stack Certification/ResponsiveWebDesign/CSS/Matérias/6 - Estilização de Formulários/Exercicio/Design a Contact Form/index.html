<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css"
    <title>Contact Form</title>
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact me</h2>
            <label for="username" >Username:<input type="text" id="username" name="username" required></label>

            <label for="email">E-mail:<input type="email" id="email" name="email" required></label>

            <label for="message">Writte me your message<textarea id="message" name="message" required></textarea></label>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
